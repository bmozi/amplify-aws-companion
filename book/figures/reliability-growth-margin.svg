<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 700 350" role="img" aria-labelledby="title desc">
  <title id="title">Growth consumes the reserve needed for an Availability Zone failure</title>
  <desc id="desc">Fictional weekly peak bookings rise from 420 to 600 per second. A 660 planning case with ten percent extra attempts needs 726 attempt capacity. The old one-zone survivor supplies 700 and is short by 26. A three-zone candidate leaves 900 application capacity after one zone fails, but its shared data path limits the total to 750, leaving 24 of modeled room.</desc>
  <rect width="700" height="350" fill="#f5f8fa"/>
  <text x="25" y="31" fill="#173247" font-family="Arial,sans-serif" font-size="22" font-weight="700">Growth spends the failure reserve</text>
  <text x="25" y="54" fill="#456275" font-family="Arial,sans-serif" font-size="14">Fictional booking-equivalent attempts per second; retries use capacity.</text>
  <rect x="25" y="68" width="650" height="116" rx="12" fill="#fff" stroke="#b9cbd6" stroke-width="2"/>
  <text x="41" y="93" fill="#173247" font-family="Arial,sans-serif" font-size="17" font-weight="700">Weekly peaks → one planning scenario</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="41" y="109" width="99" height="59" rx="8" fill="#e8f1f5"/><rect x="148" y="109" width="99" height="59" rx="8" fill="#e8f1f5"/>
    <rect x="255" y="109" width="99" height="59" rx="8" fill="#e8f1f5"/><rect x="362" y="109" width="99" height="59" rx="8" fill="#e8f1f5"/>
    <rect x="469" y="109" width="190" height="59" rx="8" fill="#fff4dc" stroke="#d6aa4c"/>
    <g fill="#173247" font-size="19" font-weight="700"><text x="90" y="136">420</text><text x="197" y="136">480</text><text x="304" y="136">540</text><text x="411" y="136">600</text><text x="564" y="136">660 → 726</text></g>
    <g fill="#456275" font-size="12"><text x="90" y="157">week 1</text><text x="197" y="157">week 2</text><text x="304" y="157">week 3</text><text x="411" y="157">week 4</text><text x="564" y="157">scenario + 10% retries</text></g>
  </g>
  <rect x="25" y="195" width="650" height="113" rx="12" fill="#fff" stroke="#b9cbd6" stroke-width="2"/>
  <text x="41" y="220" fill="#173247" font-family="Arial,sans-serif" font-size="17" font-weight="700">After one application zone fails: demand is 726</text>
  <text x="42" y="249" fill="#304d60" font-family="Arial,sans-serif" font-size="14">Old survivor</text>
  <rect x="169" y="236" width="261" height="17" rx="5" fill="#b24435"/>
  <text x="443" y="250" fill="#92392f" font-family="Arial,sans-serif" font-size="14" font-weight="700">700 · short 26</text>
  <text x="42" y="287" fill="#304d60" font-family="Arial,sans-serif" font-size="14">Candidate path</text>
  <rect x="169" y="274" width="280" height="17" rx="5" fill="#23765d"/>
  <text x="462" y="288" fill="#1e6a53" font-family="Arial,sans-serif" font-size="14" font-weight="700">750 · room 24</text>
  <text x="25" y="332" fill="#40576a" font-family="Arial,sans-serif" font-size="13">Candidate = min(900 surviving app, 750 shared data); the data path must survive too.</text>
</svg>
