<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title desc">
<title id="title">A request has two separate security decisions</title>
<desc id="desc">A request first passes a web request filter. Count continues, Block stops, and Allow reaches the application. The application separately checks who owns the requested record.</desc>
<rect width="600" height="760" fill="#f7f9fb"/>
<text x="40" y="56" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#102c4c">One request, two decisions</text>
<g font-family="Arial,sans-serif" fill="#102c4c">
<rect x="42" y="88" width="516" height="92" rx="13" fill="#d9ecf8" stroke="#276496" stroke-width="3"/>
<text x="68" y="125" font-size="24" font-weight="700">Customer request</text><text x="68" y="157" font-size="21">Alice asks for Bob&#39;s repair</text>
<path d="M300 183v42" stroke="#34587a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="42" y="230" width="516" height="110" rx="13" fill="#fff0cc" stroke="#af7116" stroke-width="3"/>
<text x="68" y="270" font-size="24" font-weight="700">Web request filter</text><text x="68" y="306" font-size="21">Inspect request shape and ordered rules</text>
<path d="M300 344v53" stroke="#34587a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="42" y="400" width="516" height="92" rx="13" fill="#e0f0e6" stroke="#35764e" stroke-width="3"/>
<text x="68" y="438" font-size="24" font-weight="700">Count or Allow: continue</text><text x="68" y="470" font-size="21">Block: stop before application</text>
<path d="M300 496v43" stroke="#34587a" stroke-width="4" marker-end="url(#arrow)"/>
<text x="319" y="523" font-size="17" fill="#34587a">if continued</text>
<rect x="42" y="544" width="516" height="128" rx="13" fill="#e0f0e6" stroke="#35764e" stroke-width="3"/>
<text x="68" y="584" font-size="24" font-weight="700">Application checks ownership</text><text x="68" y="621" font-size="21">Alice does not own Bob&#39;s record</text><text x="68" y="651" font-size="21" fill="#a53e38">Deny the record read</text>
<text x="42" y="719" font-size="19">A filter decision is not record permission.</text>
</g>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#34587a"/></marker></defs>
</svg>
