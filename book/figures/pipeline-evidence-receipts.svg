<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1140" viewBox="0 0 800 1140" role="img" aria-labelledby="title desc">
<title id="title">Five receipts connect one tested parcel to a customer outcome</title>
<desc id="desc">Five vertical receipts identify proposed source, the exact merged-build artifact, isolated tests of those bytes, the selected deployment destination, and observed customer behavior. A missing or disagreeing receipt holds the release. Cloud and load tests need isolated targets, budget and stop controls; this is a fictional decision path.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#45687a"/></marker></defs>
<rect width="800" height="1140" fill="#f7fafb"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#193b50">
<text x="35" y="57" font-size="30" font-weight="700">Which parcel did the green tests examine?</text>
<text x="35" y="91" font-size="21">Follow one identity from source to customer.</text>
<rect x="35" y="125" width="730" height="130" rx="16" fill="#e5f1f9" stroke="#568da9" stroke-width="2"/>
<text x="58" y="170" font-size="28" font-weight="700">1. Source receipt</text>
<text x="58" y="211" font-size="22">Reviewed Git revision and proposed-change checks</text>
<path d="M400 259 V281" stroke="#45687a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="35" y="293" width="730" height="130" rx="16" fill="#fff1d8" stroke="#bc8b35" stroke-width="2"/>
<text x="58" y="338" font-size="28" font-weight="700">2. Build receipt</text>
<text x="58" y="379" font-size="22">Merged inputs and exact output bytes</text>
<path d="M400 427 V449" stroke="#45687a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="35" y="461" width="730" height="130" rx="16" fill="#fbe9e7" stroke="#b65e54" stroke-width="2"/>
<text x="58" y="506" font-size="28" font-weight="700">3. Test receipt</text>
<text x="58" y="547" font-size="22">Same artifact; cases, failures, exit and scope</text>
<path d="M400 595 V617" stroke="#45687a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="35" y="629" width="730" height="130" rx="16" fill="#e9f3f6" stroke="#568da9" stroke-width="2"/>
<text x="58" y="674" font-size="28" font-weight="700">4. Deployment receipt</text>
<text x="58" y="715" font-size="22">Selected artifact and intended destination</text>
<path d="M400 763 V785" stroke="#45687a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="35" y="797" width="730" height="130" rx="16" fill="#e5f3e9" stroke="#609b72" stroke-width="2"/>
<text x="58" y="842" font-size="28" font-weight="700">5. Customer receipt</text>
<text x="58" y="883" font-size="22">Observed useful and denied behavior</text>
<rect x="35" y="948" width="730" height="118" rx="16" fill="#fff1d8" stroke="#bc8b35" stroke-width="2"/>
<text x="58" y="988" font-size="25" font-weight="700">Hold when any receipt disagrees</text>
<text x="58" y="1022" font-size="20">Cloud/load tests need a bounded target and budget.</text>
<text x="35" y="1115" font-size="18">Fictional path; no AWS release or customer test is claimed.</text>
</g></svg>
