<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" role="img" aria-labelledby="title desc">
  <title id="title">A visitor follows one complete approved media set</title>
  <desc id="desc">In a loopback media lab the private original has no visitor route. While revision eight is missing its large image, new visitors receive both variants of approved revision seven. After revision eight is complete and approved, new visitors receive both revision eight variants. Conditional withdrawal removes the local current pointer and blocks old local URLs while retaining the revision floor. This does not revoke browser downloads, prove CDN cache behavior, or test an S3 origin policy.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d3a}.title{font-size:28px;font-weight:700}.head{font-size:25px;font-weight:700}.body{font-size:22px}.note{font-size:20px}.box{stroke-width:2}.arrow{stroke:#55778b;stroke-width:4;fill:none}</style></defs>
  <rect width="800" height="1120" fill="#fff"/>
  <text x="40" y="49" class="title">Publish one complete set at a time</text>
  <text x="40" y="84" class="note">Loopback museum lab · each card is a later local state</text>
  <rect x="40" y="112" width="720" height="105" rx="14" fill="#edf1f4" stroke="#8b9fab" class="box"/>
  <text x="66" y="153" class="head">Private original and unfinished outputs</text>
  <text x="66" y="190" class="body">No visitor route; a hidden link is not a gate.</text>
  <path d="M400 218 V247" class="arrow"/><path d="M400 250 l-9 -14 h18 z" fill="#55778b"/>
  <rect x="40" y="252" width="720" height="189" rx="14" fill="#eef3f7" stroke="#66849a" class="box"/>
  <text x="66" y="293" class="head">1 · Revision 8 is incomplete</text>
  <text x="66" y="333" class="body">Current selection stays at revision 7.</text>
  <text x="66" y="371" class="body">8 has a thumbnail, but no large image.</text>
  <text x="66" y="409" class="body">Visitor receives both approved 7 variants.</text>
  <path d="M400 442 V471" class="arrow"/><path d="M400 474 l-9 -14 h18 z" fill="#55778b"/>
  <rect x="40" y="476" width="720" height="189" rx="14" fill="#eaf4ed" stroke="#4b7a60" class="box"/>
  <text x="66" y="517" class="head">2 · Revision 8 is complete and approved</text>
  <text x="66" y="557" class="body">Expected output digests match.</text>
  <text x="66" y="595" class="body">Current selection advances to revision 8.</text>
  <text x="66" y="633" class="body">Visitor receives both approved 8 variants.</text>
  <path d="M400 666 V695" class="arrow"/><path d="M400 698 l-9 -14 h18 z" fill="#55778b"/>
  <rect x="40" y="700" width="720" height="187" rx="14" fill="#f8ecea" stroke="#ab6a63" class="box"/>
  <text x="66" y="741" class="head">3 · Conditional local withdrawal</text>
  <text x="66" y="781" class="body">Current selection becomes none.</text>
  <text x="66" y="819" class="body">Revision floor remains 8.</text>
  <text x="66" y="857" class="body">Old local media URL is denied.</text>
  <rect x="40" y="913" width="720" height="155" rx="14" fill="#eaf1f5" stroke="#648392" class="box"/>
  <text x="66" y="955" class="head">The boundary of this proof</text>
  <text x="66" y="995" class="body">A fresh loopback request follows this pointer.</text>
  <text x="66" y="1033" class="note">Downloads, CDN caches and S3 origin policy need</text>
  <text x="66" y="1059" class="note">separate live checks before a global claim.</text>
</svg>
