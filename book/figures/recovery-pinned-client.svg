<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" role="img" aria-labelledby="title desc">
  <title id="title">A route switch does not move a customer pinned to the old endpoint</title>
  <desc id="desc">The same request for booking 112 takes two paths in the local recovery fixture. The current route reaches B, which has 111 and 112, and returns 200. A customer pinned to returned old source A receives 404 because A has only 111. Reconcile confirmed work and pinned clients before failback. This local HTTP fixture does not measure DNS caching or a regional drill.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173849}.title{font-size:26px;font-weight:700}.sub{font-size:17px}.head{font-size:20px;font-weight:700}.body{font-size:18px}.note{font-size:16px}.box{stroke-width:2;rx:12}.arrow{fill:#315b70}</style></defs>
  <rect width="700" height="390" fill="#f8fafb"/>
  <text x="26" y="42" class="title">One booking, two customer paths</text>
  <text x="26" y="69" class="sub">The route moved to B. The old source A later reopened.</text>
  <rect class="box" x="24" y="91" width="192" height="105" fill="#e7f2f6" stroke="#315b70"/>
  <text x="40" y="124" class="head">Current route</text><text x="40" y="158" class="body">GET booking 112</text>
  <path class="arrow" d="M220 137h25v-9l16 15-16 15v-9h-25z"/>
  <rect class="box" x="266" y="91" width="172" height="105" fill="#e4f4ec" stroke="#39705a"/>
  <text x="282" y="124" class="head">Candidate B</text><text x="282" y="158" class="body">Has 111 + 112</text>
  <path class="arrow" d="M442 137h25v-9l16 15-16 15v-9h-25z"/>
  <rect class="box" x="488" y="91" width="188" height="105" fill="#e4f4ec" stroke="#39705a"/>
  <text x="504" y="124" class="head">200: booking</text><text x="504" y="158" class="body">112 is found</text>
  <rect class="box" x="24" y="211" width="192" height="105" fill="#fff0df" stroke="#9a7138"/>
  <text x="40" y="244" class="head">Pinned old path</text><text x="40" y="278" class="body">GET booking 112</text>
  <path class="arrow" d="M220 257h25v-9l16 15-16 15v-9h-25z"/>
  <rect class="box" x="266" y="211" width="172" height="105" fill="#fff0df" stroke="#9a7138"/>
  <text x="282" y="244" class="head">Old source A</text><text x="282" y="278" class="body">Has only 111</text>
  <path class="arrow" d="M442 257h25v-9l16 15-16 15v-9h-25z"/>
  <rect class="box" x="488" y="211" width="188" height="105" fill="#fae8e5" stroke="#a75148"/>
  <text x="504" y="244" class="head">404: missing</text><text x="504" y="278" class="body">112 is absent</text>
  <rect x="24" y="331" width="652" height="47" rx="10" fill="#e8edf2" stroke="#8fa9b7" stroke-width="2"/>
  <text x="39" y="351" class="note">Reconcile confirmed work and pinned clients before failback.</text>
  <text x="39" y="371" class="note">Local HTTP paths; DNS behavior and regional recovery untested.</text>
</svg>
