<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 700" role="img" aria-labelledby="title desc">
<title id="title">Two paths through one prepared application</title>
<desc id="desc">The upper control-plane lane has an operator and infrastructure instructions configuring resources before a customer request. Its receipt is a configuration result, not a customer success. The lower data-plane lane has a customer request using the prepared application and an authorized stored result. A customer readback and a forbidden-neighbor test are separate observations. A dashed dependency from configuration to the live path means a bad change can affect service.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#31566e"/></marker></defs>
<rect width="360" height="700" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#17354b" text-anchor="middle">
<text x="180" y="32" font-size="19" font-weight="bold">ONE APP · TWO KINDS OF WORK</text>
<rect x="12" y="50" width="336" height="295" rx="16" fill="#eaf3fa" stroke="#1c6aa0" stroke-width="2"/>
<text x="180" y="78" font-size="18" font-weight="bold">1  Prepare and change</text>
<text x="180" y="100" font-size="15">CONTROL PLANE · OPERATOR WORK</text>
<rect x="46" y="117" width="268" height="45" rx="8" fill="#ffffff" stroke="#1c6aa0" stroke-width="2"/>
<text x="180" y="145" font-size="17">Operator and reviewed recipe</text>
<path d="M180 164v15" stroke="#31566e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="46" y="183" width="268" height="45" rx="8" fill="#ffffff" stroke="#1c6aa0" stroke-width="2"/>
<text x="180" y="211" font-size="17">Create or configure</text>
<path d="M180 230v15" stroke="#31566e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="46" y="249" width="268" height="45" rx="8" fill="#ffffff" stroke="#1c6aa0" stroke-width="2"/>
<text x="180" y="277" font-size="17">Prepared resources</text>
<text x="180" y="319" font-size="14" font-weight="bold">A successful change is not a saved repair.</text>
<path d="M180 347v21" stroke="#867245" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="12" y="373" width="336" height="295" rx="16" fill="#edf7f1" stroke="#337257" stroke-width="2"/>
<text x="180" y="401" font-size="18" font-weight="bold">2  Serve the customer</text>
<text x="180" y="423" font-size="15">DATA PLANE · ORDINARY SERVICE WORK</text>
<rect x="46" y="440" width="268" height="45" rx="8" fill="#ffffff" stroke="#337257" stroke-width="2"/>
<text x="180" y="468" font-size="17">Customer request</text>
<path d="M180 487v15" stroke="#31566e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="46" y="506" width="268" height="45" rx="8" fill="#ffffff" stroke="#337257" stroke-width="2"/>
<text x="180" y="534" font-size="17">Authorize and process</text>
<path d="M180 553v15" stroke="#31566e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="46" y="572" width="268" height="45" rx="8" fill="#ffffff" stroke="#337257" stroke-width="2"/>
<text x="180" y="600" font-size="17">Stored result and reply</text>
<text x="180" y="642" font-size="14" font-weight="bold">A working page is not a correct customer task.</text>
<text x="180" y="688" font-size="13">Dotted link: a change can affect live service.</text>
</g></svg>
