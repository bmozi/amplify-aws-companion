<svg xmlns="http://www.w3.org/2000/svg" width="360" height="690" viewBox="0 0 360 690" role="img" aria-labelledby="title desc">
<title id="title">A late old writer exposes two unsafe cutovers and one local authority check</title>
<desc id="desc">Maya moves booking authority from site 1 to site 2. Separate open flags let both sites confirm the same slot. An epoch check followed by a separate write leaves a gap in which authority can change. A shared local SQLite transaction checks the current epoch and inserts together, rejecting the stale writer. This does not prove a distributed or multi-Region fence, and a direct writer bypassing the check remains unsafe.</desc>
<rect width="360" height="690" fill="#f7f9fb"/>
<g font-family="Arial,sans-serif" fill="#173447">
<text x="18" y="34" font-size="21" font-weight="700">The old writer wakes</text>
<text x="18" y="59" font-size="16">Who can promise the 09:00 slot?</text>
<rect x="18" y="78" width="324" height="148" rx="10" fill="#fff0ed" stroke="#a94a35" stroke-width="2"/>
<text x="32" y="106" font-size="18" font-weight="700" fill="#8d3523">Unsafe 1 · Separate flags</text>
<text x="32" y="134" font-size="16">Site 2 opens; site 1 still thinks</text>
<text x="32" y="157" font-size="16">it may write. Both local stores</text>
<text x="32" y="180" font-size="16">can confirm the same slot.</text>
<text x="32" y="207" font-size="16" fill="#8d3523">Two promises can conflict.</text>
<rect x="18" y="241" width="324" height="162" rx="10" fill="#fff0ed" stroke="#a94a35" stroke-width="2"/>
<text x="32" y="269" font-size="18" font-weight="700" fill="#8d3523">Unsafe 2 · Check, then write</text>
<text x="32" y="297" font-size="16">The old writer checks epoch 1.</text>
<text x="32" y="320" font-size="16">Authority then moves to epoch 2.</text>
<text x="32" y="343" font-size="16">The separate write may continue:</text>
<text x="32" y="370" font-size="16" fill="#8d3523">the earlier check did not guard it.</text>
<rect x="18" y="418" width="324" height="164" rx="10" fill="#e6f2ea" stroke="#397253" stroke-width="2"/>
<text x="32" y="446" font-size="18" font-weight="700" fill="#24583d">Local control · Check at write</text>
<text x="32" y="474" font-size="16">One SQLite transaction checks</text>
<text x="32" y="497" font-size="16">the current epoch and inserts.</text>
<text x="32" y="524" font-size="16">A stale epoch is rejected, if the</text>
<text x="32" y="547" font-size="16">writer uses this authority.</text>
<text x="18" y="621" font-size="16">Local model only; no multi-Region</text>
<text x="18" y="644" font-size="16">fence was tested. A bypassing writer</text>
<text x="18" y="667" font-size="16">can still make an unsafe write.</text>
</g></svg>
