<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560" role="img" aria-labelledby="title desc">
  <title id="title">A fair dispatch order does not guarantee fast completion</title>
  <desc id="desc">Shop A has four waiting reports and Shop B has one. Separate bounded lines refuse a fifth A job and use a tenant key from verified membership. One worker dispatches A1, B1, then A2, but B1 still finishes at fictional second 601 because A1 takes 600 seconds. Shared data can delay both shops. This is a local teaching model, not an AWS latency result.</desc>
  <defs>
    <style>text{font-family:Arial,sans-serif;fill:#19313b}.title{font-size:28px;font-weight:700}.lead{font-size:20px}.head{font-size:23px;font-weight:700}.body{font-size:20px}.note{font-size:18px}.num{font-size:21px;font-weight:700;fill:#fff}</style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#315f75" stroke-width="1.8"/></marker>
  </defs>
  <rect width="700" height="560" fill="#fff"/>
  <text x="30" y="42" class="title">Two shops, one shared worker</text>
  <text x="30" y="75" class="lead">A turn to start is not a fast finish.</text>
  <rect x="30" y="101" width="305" height="83" rx="13" fill="#e7f2f8" stroke="#467b98" stroke-width="2"/>
  <text x="51" y="135" class="head">Shop A burst</text>
  <text x="51" y="166" class="body">A1, A2, A3, A4</text>
  <rect x="365" y="101" width="305" height="83" rx="13" fill="#eaf4ea" stroke="#51805a" stroke-width="2"/>
  <text x="386" y="135" class="head">Shop B request</text>
  <text x="386" y="166" class="body">B1</text>
  <path d="M350 189 V210" stroke="#315f75" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="30" y="218" width="640" height="94" rx="13" fill="#edf2f6" stroke="#617e8e" stroke-width="2"/>
  <circle cx="59" cy="246" r="16" fill="#416878"/><text x="59" y="253" class="num" text-anchor="middle">1</text>
  <text x="86" y="253" class="head">Separate, bounded waiting lines</text>
  <text x="52" y="283" class="body">A5 refused; tenant key comes from verified membership.</text>
  <path d="M350 317 V338" stroke="#315f75" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="30" y="346" width="640" height="100" rx="13" fill="#fff1dc" stroke="#ad8039" stroke-width="2"/>
  <circle cx="59" cy="375" r="16" fill="#936827"/><text x="59" y="382" class="num" text-anchor="middle">2</text>
  <text x="86" y="382" class="head">One worker: A1 → B1 → A2</text>
  <text x="52" y="415" class="body">B gets slot 2, yet finishes at second 601.*</text>
  <path d="M350 450 V471" stroke="#315f75" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="30" y="479" width="640" height="51" rx="13" fill="#eeeaf6" stroke="#76659a" stroke-width="2"/>
  <text x="52" y="511" class="head">Shared data can delay both shops further.</text>
  <text x="30" y="552" class="note">*A1 takes 600 s; B1 takes 1 s. Fictional local model, not AWS latency.</text>
</svg>
