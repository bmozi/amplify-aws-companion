<svg xmlns="http://www.w3.org/2000/svg" width="400" height="744" viewBox="0 0 400 744" role="img" aria-labelledby="title desc">
  <title id="title">An alarm event crosses separate route, execution and outcome boundaries</title>
  <desc id="desc">A CloudWatch alarm state change reaches an EventBridge rule. A matching rule attempts a Systems Manager Automation target; failed delivery goes to a dead-letter queue for inspection. An accepted target must be reconciled to an Automation execution. The read-only runbook checks current alarm state, while an independent customer-outcome check determines recovery. No path in this conceptual diagram changes a resource.</desc>
  <rect width="400" height="744" fill="#fff"/>
  <g font-family="Arial,sans-serif" fill="#193340">
    <text x="20" y="32" font-size="19" font-weight="700">A routed event is not a repair</text>
    <text x="20" y="55" font-size="14">Check each handoff before claiming progress.</text>
    <rect x="20" y="72" width="360" height="88" rx="10" fill="#e8f2f5" stroke="#2c6075" stroke-width="2"/>
    <text x="34" y="99" font-size="17" font-weight="700">1  Alarm state changed?</text>
    <text x="34" y="126" font-size="14">Source, account, Region and time</text>
    <rect x="20" y="171" width="360" height="88" rx="10" fill="#fff1d9" stroke="#9a6e2d" stroke-width="2"/>
    <text x="34" y="198" font-size="17" font-weight="700">2  EventBridge rule matched?</text>
    <text x="34" y="225" font-size="14">Match exact alarm and new state</text>
    <rect x="20" y="270" width="360" height="103" rx="10" fill="#fff1d9" stroke="#9a6e2d" stroke-width="2"/>
    <text x="34" y="297" font-size="17" font-weight="700">3  Target delivery accepted?</text>
    <text x="34" y="324" font-size="14">Check role, attempt and metrics</text>
    <text x="34" y="347" font-size="14" fill="#8f3d2c">Failed? Inspect DLQ; own replay.</text>
    <rect x="20" y="384" width="360" height="88" rx="10" fill="#e8f2f5" stroke="#2c6075" stroke-width="2"/>
    <text x="34" y="411" font-size="17" font-weight="700">4  Automation execution found?</text>
    <text x="34" y="438" font-size="14">Reconcile ID; runbook only reads</text>
    <rect x="20" y="483" width="360" height="88" rx="10" fill="#eef0f8" stroke="#586c98" stroke-width="2"/>
    <text x="34" y="510" font-size="17" font-weight="700">5  Current alarm state?</text>
    <text x="34" y="537" font-size="14">Read fresh; old event may be stale</text>
    <rect x="20" y="582" width="360" height="88" rx="10" fill="#eef0f8" stroke="#586c98" stroke-width="2"/>
    <text x="34" y="609" font-size="17" font-weight="700">Independent customer check</text>
    <text x="34" y="636" font-size="14">Mature bookings correct and on time?</text>
    <text x="20" y="705" font-size="13">Conceptual path; local files do not verify</text>
    <text x="20" y="725" font-size="13">AWS delivery, permissions or recovery.</text>
  </g>
</svg>
