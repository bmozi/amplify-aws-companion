<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 493" role="img" aria-labelledby="title desc">
<title id="title">Separate credit checks can promise the same headroom twice</title><desc id="desc">An invented balance of 80 dollars with a chosen 75 dollar reserve leaves 5 dollars of planning headroom. Two separate 3 dollar checks each show 77 dollars and pass, but together leave 74 dollars, below reserve. A single local transactional commitment record accepts the first 3 dollar run and rejects the second, leaving 2 dollars uncommitted. This is not an AWS credit reservation or a recommended reserve.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18313d}.title{font-size:17px;font-weight:700}.head{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:13px}</style></defs>
<rect width="360" height="493" fill="white"/><text x="16" y="27" class="title">Two checks promise the same money</text><text x="16" y="51" class="body">Invented: USD 80 − reserve 75 = USD 5.</text>
<rect x="16" y="65" width="328" height="148" rx="8" fill="#fff3f1" stroke="#b45a4e"/><text x="29" y="90" class="head">Separate snapshots</text><text x="29" y="116" class="body">A: 80 − 3 = 77 · pass</text><text x="29" y="140" class="body">B: 80 − 3 = 77 · pass</text><text x="29" y="169" class="head">Together: USD 74</text><text x="29" y="192" class="body">USD 1 below the reserve</text>
<rect x="16" y="226" width="328" height="157" rx="8" fill="#eff7f0" stroke="#3d7b5c"/><text x="29" y="251" class="head">One local register</text><text x="29" y="277" class="body">A commits USD 3 · accept</text><text x="29" y="300" class="body">Remaining headroom: USD 2</text><text x="29" y="329" class="head">B asks for USD 3 · hold</text><text x="29" y="352" class="body">Only USD 2 remains free.</text>
<rect x="16" y="398" width="328" height="77" rx="8" fill="#fff8e8" stroke="#a17929"/><text x="29" y="421" class="small">Local SQLite exercise; cooperating writers only.</text><text x="29" y="442" class="small">No AWS credit reservation, cross-host control</text><text x="29" y="462" class="small">or hard spending cap.</text>
</svg>
