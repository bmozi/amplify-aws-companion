<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 770" role="img" aria-labelledby="title desc">
<title id="title">A service entry alone does not protect every invoice</title>
<desc id="desc">In a local teaching fixture, an entry-only check denies the wrong workload but allows a wrong-customer request and a direct backend request. Separate backend checks deny those two requests while permitting the right customer. A copied valid receipt still succeeds, so replay and network isolation remain unproven. No AWS identity, TLS or network policy is tested.</desc>
<rect width="800" height="770" fill="#fff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#183047">
<text x="32" y="44" font-size="27" font-weight="bold">Who may read this invoice?</text>
<text x="32" y="72" font-size="18">Reachability, workload identity and customer ownership are different checks.</text>
<rect x="32" y="92" width="736" height="294" rx="12" fill="#fff3ed" stroke="#bb715e" stroke-width="2"/>
<text x="50" y="124" font-size="22" font-weight="bold">1 · Entry check only</text>
<text x="50" y="150" font-size="18">Proxy checks the workload; backend trusts the route.</text>
<line x1="50" y1="171" x2="750" y2="171" stroke="#d9ac9e"/>
<text x="50" y="205" font-size="19">Unknown workload at entry</text><text x="669" y="205" font-size="20" font-weight="bold">403</text>
<text x="50" y="249" font-size="19">Wrong customer through entry</text><text x="669" y="249" font-size="20" font-weight="bold" fill="#9b493c">200</text>
<text x="50" y="293" font-size="19">Direct route around entry</text><text x="669" y="293" font-size="20" font-weight="bold" fill="#9b493c">200</text>
<text x="50" y="352" font-size="19" font-weight="bold" fill="#9b493c">Two unwanted reads still work.</text>
<rect x="32" y="406" width="736" height="300" rx="12" fill="#eaf5ef" stroke="#5e9a7b" stroke-width="2"/>
<text x="50" y="438" font-size="22" font-weight="bold">2 · Backend checks the request and record</text>
<text x="50" y="464" font-size="18">Receipt, customer proof and invoice owner must agree.</text>
<line x1="50" y1="485" x2="750" y2="485" stroke="#a9cbb9"/>
<text x="50" y="519" font-size="19">Right customer through entry</text><text x="669" y="519" font-size="20" font-weight="bold">200</text>
<text x="50" y="559" font-size="19">Wrong customer through entry</text><text x="669" y="559" font-size="20" font-weight="bold">403</text>
<text x="50" y="599" font-size="19">Direct request without receipt</text><text x="669" y="599" font-size="20" font-weight="bold">403</text>
<text x="50" y="639" font-size="19">Copied valid receipt</text><text x="669" y="639" font-size="20" font-weight="bold" fill="#9b493c">200</text>
<text x="50" y="680" font-size="18" font-weight="bold" fill="#9b493c">Replay and backend reachability remain open.</text>
<text x="32" y="747" font-size="17">Local synthetic keys and receipts only; no AWS identity, TLS or network-policy proof.</text>
</g>
</svg>
