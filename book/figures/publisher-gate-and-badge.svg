<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 590" role="img" aria-labelledby="title description">
  <title id="title">A release gate, badge, permission and served result answer different questions</title>
  <desc id="description">Four connected stages show the manual GitHub gate, OIDC role trust, scoped AWS publication permission and separate hosted observation. A note explains that turning off the publisher workflow does not revoke role trust for another trusted workflow.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#355768"/></marker></defs>
  <rect width="600" height="590" rx="20" fill="#f8faf9"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="30" y="24" width="540" height="103" rx="17" fill="#e5f1f6" stroke="#376782" stroke-width="3"/>
    <text x="55" y="64" font-size="32" font-weight="700" fill="#17384a">1 Release gate</text>
    <text x="55" y="99" font-size="25" fill="#284c5e">Manual yes + flag + reviewed cost</text>
    <rect x="30" y="155" width="540" height="103" rx="17" fill="#e8f4ec" stroke="#3d7558" stroke-width="3"/>
    <text x="55" y="195" font-size="32" font-weight="700" fill="#1d5136">2 Role trust</text>
    <text x="55" y="230" font-size="25" fill="#2d6145">Repo + main token may receive badge</text>
    <rect x="30" y="286" width="540" height="103" rx="17" fill="#fff0d8" stroke="#a56b23" stroke-width="3"/>
    <text x="55" y="326" font-size="32" font-weight="700" fill="#765017">3 AWS grant</text>
    <text x="55" y="361" font-size="25" fill="#765017">One branch may receive publish API call</text>
    <rect x="30" y="417" width="540" height="103" rx="17" fill="#ececf7" stroke="#5b6190" stroke-width="3"/>
    <text x="55" y="457" font-size="32" font-weight="700" fill="#33395f">4 Served result</text>
    <text x="55" y="492" font-size="25" fill="#454d74">Check exact site and visitor task</text>
  </g>
  <g stroke="#355768" stroke-width="5" marker-end="url(#arrow)">
    <line x1="300" y1="128" x2="300" y2="148"/>
    <line x1="300" y1="259" x2="300" y2="279"/>
    <line x1="300" y1="390" x2="300" y2="410"/>
  </g>
  <text x="300" y="558" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#304a59">Flag off does not revoke trust for another workflow.</text>
</svg>
