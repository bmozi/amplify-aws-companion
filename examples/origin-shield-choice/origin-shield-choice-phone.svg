<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" role="img" aria-labelledby="title desc">
  <title id="title">Phone view of the fictional Origin Shield comparison</title>
  <desc id="desc">Without Shield, 13,000 regional misses reach the origin. With Shield, the exercise assumes 3,000 origin requests and 9,000 incremental billed Shield requests. Private invoices remain outside shared caching.</desc>
  <rect width="360" height="720" rx="18" fill="#fbfcfa"/>
  <g font-family="Arial,sans-serif" fill="#0f3655"><text x="20" y="38" font-size="22" font-weight="700">Does Shield earn its place?</text><text x="20" y="66" font-size="14">Fictional public guide request trace</text></g>
  <rect x="18" y="88" width="324" height="205" rx="15" fill="#eef5f9" stroke="#c2d7e3"/>
  <text x="36" y="120" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f3655">Without Shield</text>
  <text x="36" y="157" font-family="Arial,sans-serif" font-size="17" fill="#153e5b">Regional caches: 13,000 misses</text>
  <path d="M70 177H285" stroke="#1675a9" stroke-width="4"/><path d="M285 171 299 177 285 183Z" fill="#1675a9"/>
  <text x="36" y="216" font-family="Arial,sans-serif" font-size="17" fill="#153e5b">Origin prepares 13,000 responses</text>
  <text x="36" y="256" font-family="Arial,sans-serif" font-size="15" fill="#49657a">No extra Shield request meter</text>
  <rect x="18" y="313" width="324" height="254" rx="15" fill="#eef5f9" stroke="#c2d7e3"/>
  <text x="36" y="345" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f3655">With Shield</text>
  <text x="36" y="383" font-family="Arial,sans-serif" font-size="17" fill="#153e5b">Regional caches: 13,000 misses</text>
  <path d="M70 402H285" stroke="#1675a9" stroke-width="4"/><path d="M285 396 299 402 285 408Z" fill="#1675a9"/>
  <text x="36" y="440" font-family="Arial,sans-serif" font-size="17" fill="#153e5b">Shield combines repeated misses</text>
  <text x="36" y="479" font-family="Arial,sans-serif" font-size="17" fill="#153e5b">Origin: 3,000 assumed requests</text>
  <text x="36" y="526" font-family="Arial,sans-serif" font-size="15" fill="#8a5b12">9,000 assumed billable Shield requests</text>
  <rect x="18" y="589" width="324" height="101" rx="15" fill="#f3eee9" stroke="#d5c9bb"/>
  <text x="36" y="624" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#58412f">Private invoice</text>
  <text x="36" y="652" font-family="Arial,sans-serif" font-size="15" fill="#58412f">No shared cache without a separate</text>
  <text x="36" y="673" font-family="Arial,sans-serif" font-size="15" fill="#58412f">authorization and isolation proof.</text>
</svg>
