<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Origin Shield changes the origin-work count, but adds a request meter</title>
  <desc id="desc">A fictional public guide receives 13,000 regional cache misses. Without Origin Shield, all 13,000 reach the origin. With a Shield layer, the exercise assumes 3,000 reach the origin and 9,000 incur an incremental Shield charge. A private invoice remains outside shared caching.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#1675a9"/></marker></defs>
  <rect width="980" height="560" rx="24" fill="#fbfcfa"/>
  <text x="30" y="45" fill="#0f3655" font-family="Arial,sans-serif" font-size="28" font-weight="700">One public guide, two proposed paths</text>
  <text x="30" y="75" fill="#49657a" font-family="Arial,sans-serif" font-size="17">Fictional requests and USD rates; the diagram does not measure CloudFront.</text>
  <rect x="25" y="103" width="450" height="313" rx="18" fill="#eef5f9" stroke="#c2d7e3" stroke-width="2"/>
  <rect x="505" y="103" width="450" height="313" rx="18" fill="#eef5f9" stroke="#c2d7e3" stroke-width="2"/>
  <g font-family="Arial,sans-serif" fill="#0f3655"><text x="48" y="143" font-size="24" font-weight="700">Without Shield</text><text x="527" y="143" font-size="24" font-weight="700">With Shield</text></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#153e5b">
    <rect x="55" y="186" width="138" height="88" rx="13" fill="white" stroke="#4b94ba" stroke-width="2"/><text x="124" y="219" font-size="19" font-weight="700">Regional</text><text x="124" y="245" font-size="18">caches</text>
    <rect x="290" y="186" width="150" height="88" rx="13" fill="white" stroke="#4b94ba" stroke-width="2"/><text x="365" y="219" font-size="19" font-weight="700">Origin</text><text x="365" y="245" font-size="16">prepares guide</text>
    <rect x="526" y="186" width="123" height="88" rx="13" fill="white" stroke="#4b94ba" stroke-width="2"/><text x="587" y="219" font-size="18" font-weight="700">Regional</text><text x="587" y="245" font-size="17">caches</text>
    <rect x="680" y="186" width="113" height="88" rx="13" fill="#fff3db" stroke="#d7a549" stroke-width="2"/><text x="736" y="219" font-size="19" font-weight="700">Origin</text><text x="736" y="245" font-size="19">Shield</text>
    <rect x="831" y="186" width="104" height="88" rx="13" fill="white" stroke="#4b94ba" stroke-width="2"/><text x="883" y="219" font-size="19" font-weight="700">Origin</text><text x="883" y="245" font-size="16">prepares</text>
  </g>
  <g fill="none" stroke="#1675a9" stroke-width="4" marker-end="url(#arrow)"><path d="M195 230H278"/><path d="M651 230H667"/><path d="M795 230H818"/></g>
  <g font-family="Arial,sans-serif" fill="#0f3655" text-anchor="middle"><text x="247" y="205" font-size="17" font-weight="700">13,000</text><text x="662" y="179" font-size="16" font-weight="700">13,000</text><text x="812" y="180" font-size="16" font-weight="700">3,000</text><text x="248" y="323" font-size="19">13,000 origin requests</text><text x="730" y="320" font-size="19">3,000 assumed origin requests</text></g>
  <text x="48" y="366" font-family="Arial,sans-serif" font-size="17" fill="#49657a">No extra Shield request meter</text>
  <text x="527" y="366" font-family="Arial,sans-serif" font-size="17" fill="#8a5b12">9,000 assumed billable Shield requests</text>
  <rect x="25" y="438" width="930" height="88" rx="14" fill="#f3eee9" stroke="#d5c9bb" stroke-width="2"/>
  <text x="48" y="472" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#58412f">Private invoice: no shared cache in this exercise</text>
  <text x="48" y="502" font-family="Arial,sans-serif" font-size="17" fill="#58412f">An extra layer cannot justify serving one person's bytes to another person.</text>
</svg>
