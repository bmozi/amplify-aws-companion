<svg xmlns="http://www.w3.org/2000/svg" width="780" height="620" viewBox="0 0 780 620" role="img" aria-labelledby="title desc">
  <title id="title">A template change is not a customer result</title>
  <desc id="desc">A private archive bucket branches to a tag-only proposal and a bucket-name replacement proposal. The tag proposal still needs a real change set. The replacement proposal may leave an old retained bucket and a new empty one. The old bucket's separate transport policy, customer reads, data movement, access and cost need their own evidence.</desc>
  <rect width="780" height="620" fill="#fbfaf6"/>
  <text x="38" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#14344c">A template change is not a customer result</text>
  <rect x="40" y="87" width="700" height="95" rx="16" fill="#e6f0f4" stroke="#2b6681" stroke-width="3"/>
  <text x="65" y="128" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#14344c">Current private archive bucket</text>
  <text x="65" y="160" font-family="Arial,sans-serif" font-size="21" fill="#14344c">Objects + access policy + retained-data owner</text>
  <path d="M390 182 V220 M390 220 H210 V240 M390 220 H570 V240" fill="none" stroke="#2b6681" stroke-width="4"/>
  <rect x="40" y="242" width="330" height="155" rx="16" fill="#e9f4ec" stroke="#39855d" stroke-width="3"/>
  <text x="64" y="284" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#174c34">Change a tag</text>
  <text x="64" y="322" font-family="Arial,sans-serif" font-size="21" fill="#174c34">Documented: no interruption</text>
  <text x="64" y="356" font-family="Arial,sans-serif" font-size="20" fill="#174c34">Review the real change set</text>
  <rect x="410" y="242" width="330" height="155" rx="16" fill="#fff0dc" stroke="#bf7929" stroke-width="3"/>
  <text x="434" y="284" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#684014">Change bucket name</text>
  <text x="434" y="322" font-family="Arial,sans-serif" font-size="21" fill="#684014">Documented: replacement</text>
  <text x="434" y="356" font-family="Arial,sans-serif" font-size="20" fill="#684014">Hold for a migration plan</text>
  <path d="M205 397 V433 M575 397 V433" fill="none" stroke="#2b6681" stroke-width="4"/>
  <rect x="40" y="435" width="700" height="140" rx="16" fill="#f3f2f0" stroke="#59636a" stroke-width="3"/>
  <text x="64" y="475" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263943">Both paths need more evidence</text>
  <text x="64" y="512" font-family="Arial,sans-serif" font-size="21" fill="#263943">Real change set, owner, access and customer read</text>
  <text x="64" y="546" font-family="Arial,sans-serif" font-size="21" fill="#263943">Replacement: old data + policy; new access + cost decisions</text>
  <text x="40" y="605" font-family="Arial,sans-serif" font-size="17" fill="#4b5961">Cloud-free study • no stack or change set created</text>
</svg>
