<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">One request foundation and three different business promises</title>
  <desc id="desc">A common path runs from actor to accepted request, durable record and private file, later work, authorized result and customer observation. It branches into repair service, school document review and multi-tenant ticketing, each with a different invariant and rejecting test.</desc>
  <rect width="1200" height="720" fill="#f5f8f9"/>
  <text x="60" y="66" fill="#173247" font-family="Arial, sans-serif" font-weight="700" font-size="31">Same foundation, different customer promise</text>
  <text x="60" y="102" fill="#466173" font-family="Arial, sans-serif" font-size="18">Reuse the questions; change the authority, state transition and evidence.</text>

  <rect x="60" y="135" width="1080" height="174" rx="17" fill="#eaf2f5" stroke="#9eb8c7" stroke-width="2"/>
  <text x="82" y="172" fill="#173247" font-family="Arial, sans-serif" font-weight="700" font-size="20">Common path to inspect</text>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="82" y="193" width="140" height="74" rx="10" fill="#19566f"/><text x="152" y="238" fill="white">Actor</text>
    <rect x="260" y="193" width="165" height="74" rx="10" fill="#19566f"/><text x="342" y="226" fill="white">Accepted</text><text x="342" y="249" fill="white">request</text>
    <rect x="463" y="193" width="181" height="74" rx="10" fill="#19566f"/><text x="553" y="226" fill="white">Durable record</text><text x="553" y="249" fill="white">and private file</text>
    <rect x="682" y="193" width="147" height="74" rx="10" fill="#19566f"/><text x="755" y="238" fill="white">Later work</text>
    <rect x="867" y="193" width="230" height="74" rx="10" fill="#19566f"/><text x="982" y="226" fill="white">Authorized result</text><text x="982" y="249" fill="white">and observation</text>
  </g>
  <g fill="none" stroke="#557b8e" stroke-width="4" marker-end="url(#arrow)">
    <path d="M224 230H254"/><path d="M429 230H457"/><path d="M648 230H676"/><path d="M833 230H861"/>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#557b8e"/></marker></defs>

  <g font-family="Arial, sans-serif">
    <rect x="60" y="352" width="344" height="294" rx="14" fill="#e8f4f1" stroke="#4b927f" stroke-width="2"/>
    <text x="82" y="392" fill="#155449" font-size="23" font-weight="700">Repair service</text>
    <text x="82" y="424" fill="#274b49" font-size="17">Receipt means request accepted;</text>
    <text x="82" y="450" fill="#274b49" font-size="17">assignment may finish later.</text>
    <text x="82" y="496" fill="#155449" font-size="17" font-weight="700">Reject if:</text>
    <text x="82" y="523" fill="#274b49" font-size="17">one retry creates two assignments</text>
    <text x="82" y="553" fill="#274b49" font-size="17">or accepted work disappears.</text>
    <text x="82" y="615" fill="#44635c" font-size="15">A02 · durable request processing</text>

    <rect x="428" y="352" width="344" height="294" rx="14" fill="#fff4e4" stroke="#bd8a3c" stroke-width="2"/>
    <text x="450" y="392" fill="#785016" font-size="23" font-weight="700">School document</text>
    <text x="450" y="424" fill="#5c4b32" font-size="17">Arrival and scan do not equal</text>
    <text x="450" y="450" fill="#5c4b32" font-size="17">human approval of a version.</text>
    <text x="450" y="496" fill="#785016" font-size="17" font-weight="700">Reject if:</text>
    <text x="450" y="523" fill="#5c4b32" font-size="17">an unapproved version opens</text>
    <text x="450" y="553" fill="#5c4b32" font-size="17">through any read path.</text>
    <text x="450" y="615" fill="#746346" font-size="15">A04 · intake and human review</text>

    <rect x="796" y="352" width="344" height="294" rx="14" fill="#f0edfa" stroke="#8b76b5" stroke-width="2"/>
    <text x="818" y="392" fill="#554180" font-size="23" font-weight="700">Tenant ticket</text>
    <text x="818" y="424" fill="#514b68" font-size="17">Another organization cannot</text>
    <text x="818" y="450" fill="#514b68" font-size="17">read, change or restore it.</text>
    <text x="818" y="496" fill="#554180" font-size="17" font-weight="700">Reject if:</text>
    <text x="818" y="523" fill="#514b68" font-size="17">a guessed ID, shared cache or</text>
    <text x="818" y="553" fill="#514b68" font-size="17">restore crosses tenant scope.</text>
    <text x="818" y="615" fill="#665a80" font-size="15">A10 · multi-tenant service</text>
  </g>
  <text x="60" y="685" fill="#486273" font-family="Arial, sans-serif" font-size="17">Design exercise only · no AWS deployment, customer data or measured outcome</text>
</svg>
