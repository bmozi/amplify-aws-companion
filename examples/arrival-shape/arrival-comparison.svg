<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" role="img" aria-labelledby="arrival-title arrival-desc">
  <title id="arrival-title">Same total arrivals, different unfinished work</title>
  <desc id="arrival-desc">Fictional six-minute bucket chart. Even arrivals are six in every bucket and leave zero unfinished. Burst arrivals are zero, zero, eighteen, eighteen, zero, zero; under ten completions per bucket unfinished work is zero, zero, eight, sixteen, six, zero. Both traces total thirty-six arrivals.</desc>
  <rect width="360" height="620" fill="#fffdf8"/>
  <text x="18" y="30" fill="#132b47" font-family="Arial, sans-serif" font-size="20" font-weight="bold">36 photos in both traces</text>
  <text x="18" y="53" fill="#314960" font-family="Arial, sans-serif" font-size="15">Save ceiling: 10 photos per bucket</text>
  <g font-family="Arial, sans-serif" fill="#132b47" font-size="16">
    <text x="18" y="91" font-weight="bold">EVEN arrivals</text>
    <text x="18" y="197" font-weight="bold">EVEN unfinished: zero throughout</text>
    <text x="18" y="305" font-weight="bold">BURST arrivals</text>
    <text x="18" y="458" font-weight="bold">BURST unfinished</text>
  </g>
  <g fill="#1f6da6">
    <rect x="41" y="126" width="28" height="24"/><rect x="91" y="126" width="28" height="24"/>
    <rect x="141" y="126" width="28" height="24"/><rect x="191" y="126" width="28" height="24"/>
    <rect x="241" y="126" width="28" height="24"/><rect x="291" y="126" width="28" height="24"/>
    <rect x="141" y="330" width="28" height="72"/><rect x="191" y="330" width="28" height="72"/>
  </g>
  <g fill="#dc8c22">
    <rect x="141" y="533" width="28" height="32"/><rect x="191" y="501" width="28" height="64"/>
    <rect x="241" y="541" width="28" height="24"/>
  </g>
  <g fill="#132b47" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <text x="55" y="120">6</text><text x="105" y="120">6</text><text x="155" y="120">6</text>
    <text x="205" y="120">6</text><text x="255" y="120">6</text><text x="305" y="120">6</text>
    <text x="155" y="324">18</text><text x="205" y="324">18</text>
    <text x="155" y="527">8</text><text x="205" y="495">16</text><text x="255" y="535">6</text>
  </g>
  <g fill="#314960" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <text x="55" y="169">0</text><text x="105" y="169">1</text><text x="155" y="169">2</text><text x="205" y="169">3</text><text x="255" y="169">4</text><text x="305" y="169">5</text>
    <text x="55" y="275">0</text><text x="105" y="275">1</text><text x="155" y="275">2</text><text x="205" y="275">3</text><text x="255" y="275">4</text><text x="305" y="275">5</text>
    <text x="55" y="422">0</text><text x="105" y="422">1</text><text x="155" y="422">2</text><text x="205" y="422">3</text><text x="255" y="422">4</text><text x="305" y="422">5</text>
    <text x="55" y="585">0</text><text x="105" y="585">1</text><text x="155" y="585">2</text><text x="205" y="585">3</text><text x="255" y="585">4</text><text x="305" y="585">5</text>
  </g>
  <g stroke="#b9c4cf" stroke-width="1">
    <path d="M25 150H330 M25 256H330 M25 402H330 M25 565H330"/>
  </g>
  <text x="18" y="609" fill="#314960" font-family="Arial, sans-serif" font-size="13">Numbers below bars are minute buckets.</text>
</svg>
