<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Two customer roads and one separate supplier road</title>
  <desc id="desc">IPv4 A and IPv6 AAAA records lead customers to a dual-stack Application Load Balancer, which sends traffic to a private IPv4 target. A separate IPv6-only worker cannot directly reach an IPv4-only supplier; DNS64 and NAT64 are a candidate bridge.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#173b5e"/></marker></defs>
  <rect width="1120" height="620" fill="#f8fbfd"/>
  <path d="M0 55H1120 M0 105H1120 M0 155H1120 M0 205H1120 M0 255H1120 M0 305H1120 M0 355H1120 M0 405H1120 M0 455H1120 M0 505H1120 M0 555H1120" stroke="#e6eef4" stroke-width="1"/>
  <text x="50" y="49" fill="#0e3050" font-size="31" font-family="Arial,sans-serif" font-weight="bold">TWO ROADS TO THE SAME REPAIR SITE</text>
  <text x="50" y="80" fill="#35536b" font-size="18" font-family="Arial,sans-serif">A DNS answer begins a path; each leg still needs a route, permission, and response.</text>
  <rect x="50" y="142" width="180" height="145" rx="15" fill="#e9f6fc" stroke="#2585b9" stroke-width="2"/>
  <text x="75" y="184" fill="#123a5c" font-size="23" font-family="Arial,sans-serif" font-weight="bold">Customer</text>
  <text x="75" y="217" fill="#123a5c" font-size="18" font-family="Arial,sans-serif">IPv4 or IPv6</text>
  <text x="75" y="250" fill="#35627d" font-size="16" font-family="Arial,sans-serif">Test each separately</text>
  <rect x="330" y="126" width="285" height="190" rx="15" fill="#fff" stroke="#567da0" stroke-width="2"/>
  <text x="352" y="163" fill="#123a5c" font-size="21" font-family="Arial,sans-serif" font-weight="bold">DNS + front path</text>
  <text x="352" y="202" fill="#1f628d" font-size="18" font-family="Arial,sans-serif">A → IPv4 route/rule</text>
  <text x="352" y="239" fill="#0a8091" font-size="18" font-family="Arial,sans-serif">AAAA → IPv6 route/rule</text>
  <text x="352" y="280" fill="#567083" font-size="16" font-family="Arial,sans-serif">Either leg can fail alone</text>
  <rect x="690" y="135" width="180" height="170" rx="15" fill="#e8f7f5" stroke="#298f8b" stroke-width="2"/>
  <text x="712" y="177" fill="#123a5c" font-size="21" font-family="Arial,sans-serif" font-weight="bold">Dual-stack</text>
  <text x="712" y="209" fill="#123a5c" font-size="21" font-family="Arial,sans-serif" font-weight="bold">ALB</text>
  <text x="712" y="258" fill="#25576a" font-size="16" font-family="Arial,sans-serif">IPv4 + IPv6</text>
  <rect x="922" y="135" width="136" height="170" rx="15" fill="#fff8e8" stroke="#cb972d" stroke-width="2"/>
  <text x="938" y="177" fill="#654509" font-size="20" font-family="Arial,sans-serif" font-weight="bold">Private</text>
  <text x="938" y="208" fill="#654509" font-size="20" font-family="Arial,sans-serif" font-weight="bold">IPv4</text>
  <text x="938" y="239" fill="#654509" font-size="20" font-family="Arial,sans-serif" font-weight="bold">target</text>
  <path d="M870 220H920" stroke="#c68d20" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M230 183H329 M230 245H329 M615 221H688" stroke="#173b5e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="50" y="380" fill="#0e3050" font-size="24" font-family="Arial,sans-serif" font-weight="bold">SEPARATE OUTBOUND QUESTION</text>
  <rect x="50" y="410" width="230" height="142" rx="14" fill="#eff2fb" stroke="#6d7db0" stroke-width="2"/>
  <text x="72" y="451" fill="#263b68" font-size="21" font-family="Arial,sans-serif" font-weight="bold">Status worker</text>
  <text x="72" y="488" fill="#42537a" font-size="18" font-family="Arial,sans-serif">IPv6 only</text>
  <rect x="365" y="410" width="350" height="142" rx="14" fill="#fff8e8" stroke="#cb972d" stroke-width="2"/>
  <text x="388" y="451" fill="#654509" font-size="21" font-family="Arial,sans-serif" font-weight="bold">DNS64 + NAT64?</text>
  <text x="388" y="488" fill="#725c2b" font-size="17" font-family="Arial,sans-serif">Or give worker an IPv4 path</text>
  <rect x="800" y="410" width="258" height="142" rx="14" fill="#f4eff8" stroke="#8974aa" stroke-width="2"/>
  <text x="823" y="451" fill="#453669" font-size="21" font-family="Arial,sans-serif" font-weight="bold">Supplier</text>
  <text x="823" y="488" fill="#5f5476" font-size="18" font-family="Arial,sans-serif">IPv4 only</text>
  <path d="M280 480H364 M715 480H799" stroke="#173b5e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="50" y="590" fill="#516879" font-size="15" font-family="Arial,sans-serif">Design map only • no AWS resources or packet measurements</text>
</svg>
