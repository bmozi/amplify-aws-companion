<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040" role="img" aria-labelledby="title desc">
  <title id="title">Four places a rotating secret can differ</title>
  <desc id="desc">A vertical sequence shows a secret store and supplier changing to version two while a CloudFormation-injected property and a runtime cache remain on version one. Separate later actions refresh the runtime cache and the template-managed property.</desc>
  <rect width="760" height="1040" fill="#f8fbfd"/>
  <g font-family="Arial, sans-serif" fill="#102d48">
    <text x="38" y="58" font-size="34" font-weight="700">One rotation, four states</text>
    <text x="38" y="103" font-size="23">Read each row before calling the change complete.</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="23" fill="#102d48">
    <rect x="34" y="146" width="692" height="172" rx="18" fill="#e3f1f8" stroke="#2a6790" stroke-width="3"/>
    <text x="56" y="186" font-size="26" font-weight="700">1  Create: all four use v1</text>
    <text x="56" y="231">Store v1  ·  Supplier v1</text>
    <text x="56" y="274">Injected v1  ·  Runtime cache v1</text>
    <path d="M380 321v42" stroke="#b87316" stroke-width="6"/>
    <path d="m366 349 14 18 14-18" fill="none" stroke="#b87316" stroke-width="6"/>
    <rect x="34" y="372" width="692" height="198" rx="18" fill="#fff2de" stroke="#b87316" stroke-width="3"/>
    <text x="56" y="412" font-size="26" font-weight="700">2  Rotate store and supplier</text>
    <text x="56" y="457">Store v2  ·  Supplier v2</text>
    <text x="56" y="500">Injected v1  ·  Runtime cache v1</text>
    <text x="56" y="543" font-weight="700">Both consumers are stale in this case.</text>
    <path d="M380 573v42" stroke="#b87316" stroke-width="6"/>
    <path d="m366 601 14 18 14-18" fill="none" stroke="#b87316" stroke-width="6"/>
    <rect x="34" y="624" width="692" height="158" rx="18" fill="#e3f1f8" stroke="#2a6790" stroke-width="3"/>
    <text x="56" y="664" font-size="26" font-weight="700">3  Refresh the runtime reader</text>
    <text x="56" y="709">Runtime cache v2  ·  Injected still v1</text>
    <text x="56" y="752">One consumer works; one remains stale.</text>
    <path d="M380 785v42" stroke="#b87316" stroke-width="6"/>
    <path d="m366 813 14 18 14-18" fill="none" stroke="#b87316" stroke-width="6"/>
    <rect x="34" y="836" width="692" height="159" rx="18" fill="#e3f1f8" stroke="#2a6790" stroke-width="3"/>
    <text x="56" y="876" font-size="26" font-weight="700">4  Update the managed resource</text>
    <text x="56" y="921">Versionless reference retrieves v2.</text>
    <text x="56" y="964">Pinned v1 reference stays on v1.</text>
  </g>
</svg>
