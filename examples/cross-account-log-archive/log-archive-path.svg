<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 515" role="img" aria-labelledby="title desc">
 <title id="title">Trace a source event into a separate log archive account</title>
 <desc id="desc">A source workload account contains a log group and subscription. A scoped cross-account destination in the archive account routes through Firehose to S3. A separate investigator retrieves and compares a specific event.</desc>
 <rect width="960" height="515" fill="#f9fbff"/>
 <g font-family="Arial,sans-serif" fill="#112e4c"><text x="30" y="48" font-size="25" font-weight="bold">FOLLOW THE EVENT ACROSS THE BOUNDARY</text><text x="30" y="78" font-size="16">A configured filter is not a retrieved log record.</text></g>
 <rect x="30" y="115" width="320" height="185" rx="13" fill="#f0f6fc" stroke="#6b96bf" stroke-width="2"/>
 <rect x="390" y="115" width="540" height="185" rx="13" fill="#f2f0fa" stroke="#8b79b8" stroke-width="2"/>
 <g font-family="Arial,sans-serif" fill="#112e4c"><text x="48" y="145" font-size="17" font-weight="bold">WORKLOAD ACCOUNT</text><text x="408" y="145" font-size="17" font-weight="bold">ARCHIVE ACCOUNT</text></g>
 <g font-family="Arial,sans-serif" text-anchor="middle" font-size="16">
  <rect x="48" y="180" width="125" height="78" rx="9" fill="#dcecf9" stroke="#26649d" stroke-width="2"/><text x="110" y="208" fill="#112e4c">Log group</text><text x="110" y="231" fill="#112e4c">evt-204</text>
  <rect x="207" y="180" width="125" height="78" rx="9" fill="#fff0ce" stroke="#b07815" stroke-width="2"/><text x="269" y="208" fill="#503907">Subscription</text><text x="269" y="231" fill="#503907">filter</text>
  <rect x="408" y="180" width="155" height="78" rx="9" fill="#e8e3f7" stroke="#6a53a8" stroke-width="2"/><text x="485" y="208" fill="#30235d">Scoped logs</text><text x="485" y="231" fill="#30235d">destination</text>
  <rect x="598" y="180" width="140" height="78" rx="9" fill="#e8e3f7" stroke="#6a53a8" stroke-width="2"/><text x="668" y="218" fill="#30235d">Firehose</text>
  <rect x="773" y="180" width="140" height="78" rx="9" fill="#e1f1e6" stroke="#3d8054" stroke-width="2"/><text x="843" y="208" fill="#1e4b2a">S3 archive</text><text x="843" y="231" fill="#1e4b2a">object</text>
  <rect x="550" y="360" width="335" height="83" rx="9" fill="#fff0ce" stroke="#b07815" stroke-width="2"/><text x="717" y="388" fill="#503907">Investigator retrieves evt-204</text><text x="717" y="411" fill="#503907">and compares identity and content</text><text x="717" y="432" fill="#503907">under approved access</text>
 </g>
 <g stroke="#cc7413" stroke-width="4" fill="none" stroke-linecap="round"><path d="M173 219h34M332 219h76M563 219h35M738 219h35M843 258v52H717v50"/><path d="M195 211l12 8-12 8M396 211l12 8-12 8M586 211l12 8-12 8M761 211l12 8-12 8M709 348l8 12 8-12"/></g>
 <text x="32" y="485" font-family="Arial,sans-serif" font-size="16" fill="#112e4c">Alert on failed delivery and missing test events. Retrieve an actual object before claiming coverage.</text>
</svg>
