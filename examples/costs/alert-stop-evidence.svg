<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="title desc">
  <title id="title">A budget alert is not a cleanup receipt</title>
  <desc id="desc">A fictional timeline shows an alert at 10:00, a report that a named worker stopped at 10:05, a replacement worker at 10:07, and a retained volume observed at 10:15. Each observation answers a separate question. Neither the alert nor the stop report proves that all usage stopped or that storage was removed. Later billing and the full inventory are unknown.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17374a}.title{font-weight:700;font-size:17px}.sub{font-size:12px}.time{font-size:15px;font-weight:700}.head{font-size:14px;font-weight:700}.body{font-size:12px}.foot{font-size:12px;font-weight:700}</style></defs>
  <rect width="360" height="480" fill="#fff"/>
  <text x="16" y="27" class="title">An alert is not a cleanup receipt</text>
  <text x="16" y="48" class="sub">Fictional observations, one experiment</text>
  <line x1="64" y1="73" x2="64" y2="362" stroke="#587989" stroke-width="2"/>
  <circle cx="64" cy="91" r="5" fill="#b88026"/><text x="16" y="80" class="time">10:00</text>
  <rect x="72" y="66" width="272" height="65" rx="8" fill="#fff2dc" stroke="#ad7c30"/>
  <text x="84" y="88" class="head">Budget alert arrives</text><text x="84" y="107" class="body">A warning; not a stop receipt</text>
  <circle cx="64" cy="172" r="5" fill="#46738b"/><text x="16" y="160" class="time">10:05</text>
  <rect x="72" y="146" width="272" height="65" rx="8" fill="#eaf3f7" stroke="#47738a"/>
  <text x="84" y="168" class="head">Named worker stopped</text><text x="84" y="187" class="body">Reported action; one worker only</text>
  <circle cx="64" cy="252" r="5" fill="#6b799a"/><text x="16" y="240" class="time">10:07</text>
  <rect x="72" y="226" width="272" height="65" rx="8" fill="#eef0f8" stroke="#6c7eaa"/>
  <text x="84" y="248" class="head">Group launches replacement</text><text x="84" y="267" class="body">Capacity can return after a stop</text>
  <circle cx="64" cy="332" r="5" fill="#548265"/><text x="16" y="320" class="time">10:15</text>
  <rect x="72" y="306" width="272" height="65" rx="8" fill="#e9f4eb" stroke="#568468"/>
  <text x="84" y="328" class="head">Volume still in inventory</text><text x="84" y="347" class="body">Storage needs its own decision</text>
  <rect x="16" y="397" width="328" height="61" rx="8" fill="#f5f6f7" stroke="#a5b2b9"/>
  <text x="28" y="420" class="foot">Still unknown: full inventory and later bill.</text>
  <text x="28" y="440" class="sub">Identify owners before making changes.</text>
</svg>
