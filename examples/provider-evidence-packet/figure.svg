<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Two evidence tracks join in a controlled packet</title>
  <desc id="desc">An auditor's question splits into an AWS provider report receipt with service, Region, control and period scope and a customer configuration observation for the specific resource. Both join in a controlled evidence packet; missing scope or customer evidence stops the claim.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#214767"/></marker></defs>
  <rect width="1120" height="620" fill="#f8fbfd"/>
  <path d="M0 50H1120 M0 100H1120 M0 150H1120 M0 200H1120 M0 250H1120 M0 300H1120 M0 350H1120 M0 400H1120 M0 450H1120 M0 500H1120 M0 550H1120" stroke="#e8eef2" stroke-width="1"/>
  <text x="50" y="48" fill="#0d3151" font-size="30" font-family="Arial,sans-serif" font-weight="bold">ONE AUDITOR QUESTION. TWO EVIDENCE TRACKS.</text>
  <text x="50" y="79" fill="#3d5a70" font-size="18" font-family="Arial,sans-serif">Which owner did what, for this service, Region, resource and time?</text>
  <rect x="50" y="220" width="205" height="145" rx="16" fill="#e6f1fa" stroke="#4b87b7" stroke-width="2"/>
  <text x="74" y="263" fill="#123a5d" font-size="22" font-family="Arial,sans-serif" font-weight="bold">Auditor asks</text>
  <text x="74" y="303" fill="#355876" font-size="17" font-family="Arial,sans-serif">Control + period</text>
  <text x="74" y="334" fill="#355876" font-size="17" font-family="Arial,sans-serif">Maya's S3 bucket</text>
  <rect x="345" y="126" width="335" height="164" rx="16" fill="#e9f7f5" stroke="#328f89" stroke-width="2"/>
  <text x="370" y="166" fill="#135852" font-size="21" font-family="Arial,sans-serif" font-weight="bold">AWS provider receipt</text>
  <text x="370" y="203" fill="#316762" font-size="17" font-family="Arial,sans-serif">Actual report scope reviewed?</text>
  <text x="370" y="234" fill="#316762" font-size="17" font-family="Arial,sans-serif">Service • Region • period</text>
  <text x="370" y="265" fill="#316762" font-size="17" font-family="Arial,sans-serif">Controlled document access</text>
  <rect x="345" y="325" width="335" height="164" rx="16" fill="#fff5e7" stroke="#cd9636" stroke-width="2"/>
  <text x="370" y="365" fill="#704e12" font-size="21" font-family="Arial,sans-serif" font-weight="bold">Customer observation</text>
  <text x="370" y="402" fill="#765d32" font-size="17" font-family="Arial,sans-serif">Exact bucket + control</text>
  <text x="370" y="433" fill="#765d32" font-size="17" font-family="Arial,sans-serif">Observed time + result</text>
  <text x="370" y="464" fill="#765d32" font-size="17" font-family="Arial,sans-serif">Named reviewer</text>
  <rect x="775" y="219" width="295" height="166" rx="16" fill="#edf0f9" stroke="#697db0" stroke-width="2"/>
  <text x="800" y="261" fill="#283f70" font-size="21" font-family="Arial,sans-serif" font-weight="bold">Controlled packet</text>
  <text x="800" y="300" fill="#44577d" font-size="17" font-family="Arial,sans-serif">Both receipts + gaps</text>
  <text x="800" y="332" fill="#44577d" font-size="17" font-family="Arial,sans-serif">Reviewable conclusion</text>
  <path d="M255 293H295V207H344 M295 293V407H344 M680 207H728V290H774 M680 407H728V311H774" fill="none" stroke="#214767" stroke-width="3" marker-end="url(#a)"/>
  <text x="50" y="555" fill="#9b4428" font-size="18" font-family="Arial,sans-serif" font-weight="bold">STOP: a report title, wrong scope, or missing customer record cannot support the full claim.</text>
  <text x="50" y="590" fill="#566d7f" font-size="15" font-family="Arial,sans-serif">Fictional metadata only • do not publish a watermarked AWS report</text>
</svg>
