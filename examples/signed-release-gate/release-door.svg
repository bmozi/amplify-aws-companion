<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 650" role="img" aria-labelledby="title desc">
  <title id="title">A signed parcel reaches a guarded release door</title>
  <desc id="desc">The exact artifact bytes and a completed scan report each have a digest. A trusted signer binds both digests and the release identity in one statement. At a separate release door, the public key verifies that signature; the gate also checks the artifact, report, scan coverage, age and findings. Any failed check holds the release. A passing gate does not prove customer behavior or deployment.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#275c7c"/></marker></defs>
  <rect width="360" height="650" fill="#fffdf8"/>
  <g font-family="Arial,sans-serif" fill="#142d43">
    <text x="18" y="32" font-size="20" font-weight="700">Who lets this parcel through?</text>
    <text x="18" y="55" font-size="14">A release has two jobs: prove identity, then decide.</text>
    <rect x="18" y="76" width="324" height="92" rx="12" fill="#eaf3fb" stroke="#3a7094" stroke-width="2"/>
    <text x="34" y="101" font-size="16" font-weight="700">1  Make the evidence</text>
    <text x="34" y="126" font-size="14">Artifact B bytes → digest B</text>
    <text x="34" y="150" font-size="14">Completed scan of B → report digest</text>
    <path d="M180 170 V188" stroke="#275c7c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="18" y="192" width="324" height="92" rx="12" fill="#eaf3fb" stroke="#3a7094" stroke-width="2"/>
    <text x="34" y="217" font-size="16" font-weight="700">2  Sign the statement</text>
    <text x="34" y="242" font-size="14">Bind release name + both digests.</text>
    <text x="34" y="266" font-size="14">Signing key endorses those bytes.</text>
    <path d="M180 286 V304" stroke="#275c7c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="18" y="308" width="324" height="118" rx="12" fill="#e9f4ed" stroke="#448263" stroke-width="2"/>
    <text x="34" y="333" font-size="16" font-weight="700">3  Check at a separate door</text>
    <text x="34" y="358" font-size="14">Pinned public key verifies signer.</text>
    <text x="34" y="382" font-size="14">Compare bytes, coverage, age, findings.</text>
    <text x="34" y="406" font-size="14">Any failed check → hold the release.</text>
    <path d="M180 428 V446" stroke="#275c7c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="18" y="450" width="324" height="76" rx="12" fill="#fff0d8" stroke="#aa7131" stroke-width="2"/>
    <text x="34" y="476" font-size="16" font-weight="700">4  Record a bounded result</text>
    <text x="34" y="502" font-size="14">Pass the local gate or name the hold.</text>
    <rect x="18" y="544" width="324" height="82" rx="10" fill="#f2f4f7" stroke="#778b9a" stroke-width="1.5"/>
    <text x="34" y="569" font-size="14" font-weight="700">The door has limits</text>
    <text x="34" y="591" font-size="13">It did not run a real scan or deployment.</text>
    <text x="34" y="612" font-size="13">Customer behavior needs separate proof.</text>
  </g>
</svg>
